# Publishes site/index.html (the optional HTML dashboard) to GitHub Pages after each tracker or mitigation run.
# Opt-in with the repository variable ENABLE_FINDINGS_PAGES=true and Settings > Pages > Source: GitHub Actions.
# Only for GitHub Enterprise Cloud with Pages visibility set to private: on other plans Pages is public.
# Only the page is published; its CSV and docs links point back to the repository, which needs repository access.
name: Publish findings dashboard

on:
  workflow_run:
    workflows: [Veracode findings tracker, Veracode mitigations]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: findings-dashboard-pages
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      vars.ENABLE_FINDINGS_PAGES == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false

      - name: Check the dashboard exists
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html not found. Run the Veracode findings tracker once with ENABLE_FINDINGS_PAGES=true."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

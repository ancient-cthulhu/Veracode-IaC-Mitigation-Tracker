# Publishes the generated interactive dashboard only when the repository owner opts in.
# GitHub Pages is public-facing; do not enable it for sensitive finding data.
name: Publish findings dashboard

on:
  workflow_run:
    workflows: [Veracode findings tracker, Veracode mitigations]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: findings-dashboard-pages
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      vars.ENABLE_FINDINGS_PAGES == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
